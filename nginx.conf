events { worker_connections 4096; }

http {
    upstream ktor_backend {
        ip_hash;
        server ktor-node-1:8080;
        server ktor-node-2:8080;
        keepalive 64;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ✅ §2.3: Force HTTPS — redirect all HTTP to HTTPS
    server {
        listen 80;
        server_name signaling.streamlink.com;
        return 301 https://$host$request_uri;
    }

    # ✅ §2.3: Real TLS termination at nginx edge (internal network stays plaintext)
    server {
        listen 443 ssl http2;
        server_name signaling.streamlink.com;

        # Mount real CA-signed certs (e.g. Let's Encrypt via certbot)
        # Place in ./certs/fullchain.pem and ./certs/privkey.pem
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Health check
        location /health {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
        }

        # Dashboard HTML
        location /dashboard/ {
            alias /usr/share/nginx/html/dashboard/;
            index index.html;
        }

        # Dashboard WebSocket Metrics
        location /metrics {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # WebSocket signaling — sticky by userId (hash of URI)
        location /signal/ {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Legacy handoff
        location /stream/ {
            proxy_pass http://ktor_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }
    }
}
