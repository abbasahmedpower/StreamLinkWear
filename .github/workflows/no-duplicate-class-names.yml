name: No Duplicate Class Names

# Prevents "AI Conway's Law": two AI sessions proposing identically-named classes
# in different packages, causing silent split-brain and ambiguous injection.
# Fails the PR if any two .kt files define a type with the same simple name.

on:
  push:
    branches: [ main, master, dev, feature/** ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  check-duplicate-class-names:
    runs-on: ubuntu-latest
    name: Scan for duplicate Kotlin type names

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract top-level type declarations
        id: extract
        run: |
          # Collect: class/object/interface/enum/data class simple names from all .kt files.
          # Output: "SimpleName  FilePath" per line, sorted.
          grep -rn --include="*.kt" \
            -E '^\s*(public |internal |private |protected )?(sealed |data |abstract |open |enum )?(class|object|interface)\s+[A-Z][A-Za-z0-9_]+' \
            . \
            | grep -v '/build/' \
            | sed 's/.*\(class\|object\|interface\) \([A-Za-z0-9_]*\).*/\2/' \
            | sort > /tmp/all_names.txt

          # Find names that appear more than once
          duplicates=$(sort /tmp/all_names.txt | uniq -d)

          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate Kotlin type names found across modules:"
            echo "$duplicates"
            echo ""
            echo "Each type name must be unique project-wide to prevent ambiguous injection"
            echo "and AI session conflicts. Rename one of the colliding types."
            exit 1
          fi

          echo "No duplicate type names found."
