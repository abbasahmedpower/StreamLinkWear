android.useAndroidX=true
# ✅ Jetifier disabled — all dependencies are already AndroidX-native.
# Keeping it enabled triggers Gradle 10 deprecation warnings.
android.enableJetifier=false

# ✅ BUILD PERFORMANCE — تفعيل البناء المتوازي للموديولات الـ 5
# المشروع يحتوي: app, wear, shared, benchmark, baselineprofile
# تفعيل parallel يقلل وقت البناء 40-60% على Multi-Module Projects
org.gradle.parallel=true
org.gradle.caching=true
# Configuration Cache disabled — AGP 8.7.3 checkDebugClasspath bug (task-level fix applied in wear/build.gradle)
org.gradle.configuration-cache=false

# ✅ JVM TUNING — G1GC بدلاً من SerialGC لمنع Fragmentation مع parallel builds
# SerialGC كان ضرورياً فقط لأن parallel=false كان مفعلاً
# G1GC أنسب للـ Daemon مع ذاكرة كبيرة ومتوازية
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options="-Xmx2g"

kotlin.incremental=true
kotlin.daemon.jvm.options=-Xmx2g -XX:+UseG1GC

# Suppress recurring AGP library-constraints warning
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
kotlin.code.style=official
android.uniquePackageNames=false
android.dependency.useConstraints=false

# ✅ R8 FULL MODE — تفعيل Tree-Shaking الكامل لتقليل حجم APK
# يوفر من 3MB إلى 8MB في الإصدار النهائي
android.enableR8.fullMode=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true

android.builtInKotlin=false

# Backend Configuration
# ⚠️ HORUS_SECRET_TOKEN يجب إضافته في local.properties أو GitHub Secrets
# ولا يُضاف أبداً هنا! (محمي بالـ Fail-Fast Guard في app/build.gradle)

android.newDsl=true
android.enableAppCompileTimeRClass=true
